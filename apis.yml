name: BorrowMyDoggy
description: >-
  BorrowMyDoggy is a UK-based platform that connects dog owners with trusted
  local borrowers for dog walking, sitting, boarding, and holiday care. Owners
  who cannot always be with their dog are matched with nearby dog lovers who
  want to spend time with a dog without the full-time commitment, so dogs get
  more walks, company, and care. Membership is free to join, with optional
  Premium tiers for owners and borrowers that unlock messaging, insurance cover,
  and a 24/7 vet line. The company operates a consumer web and mobile
  application built on Ruby on Rails; it does not currently publish a public
  developer API, SDKs, or developer documentation. This profile was surfaced as
  a portfolio company of 500 Global and enriched from public web surfaces.
